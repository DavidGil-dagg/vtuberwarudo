<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VtuberWarudo Chat</title>
  <link rel="stylesheet" href="/static/style.css?v=2" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="who">
        <span class="avatar-dot" aria-hidden="true"></span>
        <h1 id="name">Personaje</h1>
      </div>
      <div class="status">
        <span class="pill" id="st-lm" title="LM Studio">LM Studio</span>
        <span class="pill" id="st-dec" title="Modelo de decisión (emociones y gestos). Si está en rojo, arranca scripts\start-startlux.ps1">StartLux</span>
        <span class="pill" id="st-warudo" title="Warudo (AI Chat Bridge)">Warudo</span>
        <button id="vision-btn" class="ghost" type="button" title="El personaje reacciona a tu pantalla y a tu micrófono" hidden>👁 Modo visión</button>
        <button id="new-chat" class="ghost" type="button" title="Empezar una conversación nueva">Nueva conversación</button>
      </div>
    </header>

    <section id="vision-panel" class="vision-panel" hidden aria-live="polite">
      <div class="vision-head">
        <span class="live-dot" aria-hidden="true"></span>
        <strong>Modo visión</strong>
        <span id="vision-mic" class="muted"></span>
        <span class="meter" title="Nivel del micrófono (la raya marca a partir de dónde se considera voz)">
          <span id="meter-fill" class="meter-fill"></span>
          <span id="meter-thr" class="meter-thr"></span>
        </span>
      </div>
      <ul id="vision-log" class="vision-log"></ul>
    </section>

    <main id="log" class="log" aria-live="polite"></main>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje…" aria-label="Mensaje"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
